[package]
name = "image_conversion"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# cdylib: WebAssembly などの「他の言語から呼び出すライブラリ」として出力する
# rlib: `cargo test` でテストを動かすために必要
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
